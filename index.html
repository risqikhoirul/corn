<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Corn Aqiela AI 🌽</title>

    <!-- Tailwind -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- TensorFlow.js -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>

    <!-- Icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet" />

    <style>
      .glass {
        background: rgba(255, 255, 255, 0.75);
        backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, 0.4);
      }
    </style>
  </head>

  <body class="min-h-screen bg-gradient-to-br from-emerald-100 via-green-50 to-lime-100 flex flex-col">
    <nav class="px-6 py-4 flex justify-between items-center">
      <h1 class="text-2xl font-black text-emerald-700">🌽 CORN AQIELA AI</h1>
    </nav>

    <main class="flex-grow flex items-center justify-center px-4">
      <div class="glass w-full max-w-md rounded-3xl shadow-2xl p-6">
        <div class="text-center mb-5">
          <h2 class="text-3xl font-extrabold text-slate-800">Deteksi Penyakit Jagung</h2>
          <p class="text-sm text-slate-500 mt-2">Upload atau foto langsung daun jagung 🌿</p>
        </div>

        <!-- CAMERA STATUS -->
        <div id="cameraStatus" class="mb-3 p-3 rounded-xl bg-yellow-100 border border-yellow-300 text-sm text-yellow-800">📸 Kamera belum diizinkan. Klik <b>Kamera</b> lalu pilih <b>Allow</b>.</div>

        <!-- CAMERA -->
        <div id="cameraBox" class="hidden">
          <video id="video" autoplay playsinline class="w-full h-56 rounded-2xl object-cover shadow"></video>

          <button onclick="capturePhoto()" class="mt-3 w-full py-3 rounded-xl bg-gradient-to-r from-emerald-500 to-lime-500 text-white font-bold shadow-lg hover:scale-105 transition">📸 Ambil Foto</button>
        </div>

        <!-- PREVIEW -->
        <div id="previewBox" class="hidden">
          <img id="previewImg" class="w-full h-56 rounded-2xl object-cover shadow" />
        </div>

        <!-- BUTTONS -->
        <div class="grid grid-cols-2 gap-3 mt-4">
          <button onclick="openCamera()" class="py-3 rounded-xl bg-emerald-600 text-white font-semibold shadow hover:bg-emerald-700 transition"><i class="fas fa-camera mr-1"></i> Kamera</button>

          <label class="py-3 rounded-xl bg-slate-700 text-white font-semibold shadow hover:bg-slate-800 transition text-center cursor-pointer">
            <i class="fas fa-upload mr-1"></i> Upload
            <input type="file" id="fileInput" accept="image/*" class="hidden" />
          </label>
        </div>

        <!-- ANALYZE -->
        <button id="analyzeBtn" class="hidden w-full mt-4 py-4 rounded-2xl bg-gradient-to-r from-emerald-600 to-green-600 text-white font-black tracking-wide shadow-xl hover:scale-105 transition">🚀 ANALISIS SEKARANG</button>

        <!-- SPINNER -->
        <div id="loadingBox" class="hidden mt-6 flex flex-col items-center text-emerald-700">
          <i class="fas fa-spinner fa-spin text-4xl mb-3"></i>
          <p class="text-sm font-semibold animate-pulse">AI sedang menganalisis gambar...</p>
        </div>

        <!-- RESULT -->
        <div id="resultBox" class="hidden mt-4 p-4 rounded-2xl bg-emerald-100 border border-emerald-300 text-center">
          <p class="text-sm text-emerald-700">Hasil Diagnosa</p>
          <h3 id="resultLabel" class="text-2xl font-black text-emerald-900 mt-1"></h3>
          <p id="resultConf" class="text-xs text-emerald-700 mt-1"></p>
        </div>
      </div>
    </main>

    <footer class="text-center py-6 text-xs text-slate-400">© 2025 INTAN NUR AQIELA • 221101093 🌱</footer>

    <script>
      /* ================= CONFIG ================= */
      const MODEL_URL = "model/model.json";
      const INPUT_SIZE = 224;

      const LABELS = ["Healthy", "Leaf Blight", "Leaf Spot", "Rust"];
      const LABEL_ID = {
        Healthy: "🌱 Daun Jagung Sehat",
        "Leaf Blight": "🍂 Penyakit Hawar Daun",
        "Leaf Spot": "🟤 Penyakit Bercak Daun",
        Rust: "🟠 Penyakit Karat Daun",
      };

      /* ================= STATE ================= */
      let model = null;
      let stream = null;
      let imageSource = null;

      /* ================= ELEMENT ================= */
      const video = document.getElementById("video");
      const cameraBox = document.getElementById("cameraBox");
      const previewBox = document.getElementById("previewBox");
      const previewImg = document.getElementById("previewImg");
      const analyzeBtn = document.getElementById("analyzeBtn");
      const loadingBox = document.getElementById("loadingBox");
      const resultBox = document.getElementById("resultBox");
      const resultLabel = document.getElementById("resultLabel");
      const resultConf = document.getElementById("resultConf");
      const cameraStatus = document.getElementById("cameraStatus");
      const fileInput = document.getElementById("fileInput");

      /* ================= LOAD MODEL ================= */
      tf.loadGraphModel(MODEL_URL).then((m) => {
        model = m;
        console.log("✅ Model loaded");
      });

      /* ================= CAMERA ================= */
      async function openCamera() {
        try {
          stream = await navigator.mediaDevices.getUserMedia({ video: true });
          video.srcObject = stream;

          cameraStatus.classList.add("hidden");
          cameraBox.classList.remove("hidden");
          previewBox.classList.add("hidden");
          analyzeBtn.classList.add("hidden");
        } catch {
          alert("🚫 Kamera diblokir.\n\n" + "Buka chrome://settings/content/camera\n" + "Izinkan website ini lalu refresh.");
        }
      }

      function capturePhoto() {
        const canvas = document.createElement("canvas");
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        canvas.getContext("2d").drawImage(video, 0, 0);

        imageSource = canvas;
        previewImg.src = canvas.toDataURL("image/jpeg");

        cameraBox.classList.add("hidden");
        previewBox.classList.remove("hidden");
        analyzeBtn.classList.remove("hidden");

        if (stream) stream.getTracks().forEach((t) => t.stop());
      }

      /* ================= UPLOAD ================= */
      fileInput.onchange = (e) => {
        const img = new Image();
        img.src = URL.createObjectURL(e.target.files[0]);
        img.onload = () => {
          imageSource = img;
          previewImg.src = img.src;
          previewBox.classList.remove("hidden");
          analyzeBtn.classList.remove("hidden");
        };
      };

      /* ================= PREDICT (SPINNER FIXED) ================= */
      analyzeBtn.onclick = async () => {
        if (!model || !imageSource) return;

        // SHOW SPINNER
        analyzeBtn.classList.add("hidden");
        resultBox.classList.add("hidden");
        loadingBox.classList.remove("hidden");

        // FORCE UI RENDER
        await new Promise(requestAnimationFrame);
        await new Promise((r) => setTimeout(r, 80));

        const tensor = tf.browser.fromPixels(imageSource).resizeBilinear([INPUT_SIZE, INPUT_SIZE]).expandDims(0).toFloat().div(255);

        const scores = await model.predict(tensor).data();
        const idx = scores.indexOf(Math.max(...scores));

        const labelEN = LABELS[idx];
        const labelID = LABEL_ID[labelEN];

        resultLabel.innerHTML = `
    ${labelID}<br>
    <span class="text-sm font-semibold text-slate-600">(${labelEN})</span>
  `;
        resultConf.innerText = "Tingkat Keyakinan: " + (scores[idx] * 100).toFixed(2) + "%";

        tensor.dispose();

        loadingBox.classList.add("hidden");
        resultBox.classList.remove("hidden");
        analyzeBtn.classList.remove("hidden");
      };
    </script>
  </body>
</html>
